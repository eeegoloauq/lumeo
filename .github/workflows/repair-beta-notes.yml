name: Repair beta release notes

on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-beta-notes.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.80-beta.1
    steps:
      - name: Remove the copied tag signature and installation section
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/current.md"
          python3 - "$RUNNER_TEMP/current.md" "$RUNNER_TEMP/notes.md" <<'PY'
          import re
          import sys
          from pathlib import Path

          source, output = map(Path, sys.argv[1:])
          body = source.read_text()
          prefix = (
              r"\ASystem media controls and subtitle choices across episodes\n"
              r"-----BEGIN SSH SIGNATURE-----\n.*?^-----END SSH SIGNATURE-----\n\n*"
          )
          body, removed_prefix = re.subn(prefix, "", body, count=1, flags=re.M | re.S)
          install = r"^## Install\n.*?^`SHA256SUMS` lists the checksum of every file\.\n*"
          body, removed_install = re.subn(install, "", body, count=1, flags=re.M | re.S)
          body = re.sub(r"^System media controls and subtitle choices across episodes\n*", "", body, flags=re.M)
          if removed_prefix != 1 or removed_install != 1:
              raise SystemExit("The published notes differ from the expected text")
          if not body.startswith("## Added\n") or "## Fixed\n" not in body:
              raise SystemExit("The repaired notes are missing release sections")
          output.write_text(body.strip() + "\n")
          PY
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
