# What a tag produces: a tarball anyone can unpack, an RPM Fedora can install,
# a package Arch can, and a Windows installer. All come out of packaging/, which is also what a
# person runs by hand — the workflow is only the machine that runs those
# scripts.
#
# No job here restores a cache. A release is built from what the pinned
# versions download, not from state an earlier run left behind (a cache is a
# way into the artifact: zizmor's cache-poisoning audit), and a cache saved on
# a tag is readable by that tag alone, so it was saved on every release and
# read by none. ci.yml on main caches.
name: release

on:
  push:
    tags: ["v*"]
  # To rebuild a release by hand against an existing tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: false
      # What the Flutter Linux build needs from the machine. libmpv-dev is in
      # the list because media_kit_video links PkgConfig::mpv in its own
      # CMakeLists: the Dart side dlopen()s libmpv at runtime, but the plugin
      # underneath it does not, and a machine without the headers fails at the
      # CMake generate step. The RPM still names mpv-libs by hand — see the
      # note in packaging/lumeo.spec.
      - name: build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev \
            librsvg2-bin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
      - run: flutter pub get
        working-directory: client
      - name: build
        run: packaging/build-dist.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: dist/*.tar.gz

  rpm:
    needs: dist
    runs-on: ubuntu-latest
    # Fedora's own container, because the spec's %check runs Fedora's
    # validators and a package that has never been validated is a package that
    # fails review the first time anyone looks at it.
    container: fedora:44
    steps:
      - uses: actions/checkout@v7
      - run: dnf install -y rpm-build desktop-file-utils libappstream-glib tar
      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: dist
      - run: packaging/build-rpm.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: dist/rpmbuild/RPMS/**/*.rpm

  arch:
    needs: dist
    runs-on: ubuntu-latest
    # Arch's own container, for makepkg and the compression it expects.
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: dist
      # makepkg refuses to run as root, which is what a container job is.
      - run: |
          useradd -m builder
          chown -R builder .
          su builder -c "packaging/build-arch.sh '${GITHUB_REF_NAME#v}'"
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  windows:
    runs-on: windows-2025
    # Git Bash, so build-windows.sh is the same script by hand and here.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
      - run: flutter pub get
        working-directory: client
      # Inno Setup is on the image, but not on PATH.
      - run: echo "C:\Program Files (x86)\Inno Setup 6" >> "$GITHUB_PATH"
      - run: packaging/build-windows.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.exe

  # Waits for every build: the release appears whole, with one SHA256SUMS
  # over all of its files, or not at all.
  publish:
    needs: [dist, rpm, arch, windows]
    runs-on: ubuntu-latest
    # The only job that writes to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: collect
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.rpm' \
            -o -name '*.pkg.tar.zst' -o -name '*.exe' \) -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS
      # The release notes are the message of the annotated tag; the generated
      # commit list is appended after them.
      - name: notes from the tag message
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$PWD"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
          git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
