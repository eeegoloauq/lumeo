# The client's checks. The core is not here: it is gated in Forgejo, where
# the pull requests are, and running it again on the mirror would spend a
# build on every commit to say what is already known.
#
# Hence the path filter too. A commit that only touches docs, packaging or the
# core builds nothing here, which is the common case.
#
# One job builds desktop/ once and runs every layer on it: units and app
# tests offscreen, then the player tests on headless Weston with a real
# libmpv (docs/decisions/testing.md). release.yml calls this too and
# publishes only when it passes.
name: ci

on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - design/**
      - packaging/install-qt.sh
      - .github/workflows/ci.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    # Named, not latest: the runner's libmpv is the oldest one the tests
    # cover, and moves only when we move it.
    runs-on: ubuntu-24.04
    # A run takes about ten minutes; a hung test would otherwise hold the
    # runner for GitHub's default six hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # What building against Qt and running on a screen need from the
      # machine: libmpv is the system's (decisions/shipping.md), Weston is
      # the screen, ffmpeg makes the player tests' clips.
      - name: build dependencies
        # Seconds when the runner's apt mirror answers; a stalled one hangs.
        timeout-minutes: 10
        run: |
          # A stalled mirror connection is dropped and tried again rather
          # than left to hang the job.
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/99lumeo-retries >/dev/null
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config ccache mold \
            libgl-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libmpv-dev weston ffmpeg
      # Not when release.yml calls this (it restores no cache, and says
      # why): a called workflow carries the caller's name.
      - uses: actions/cache@v6
        if: github.workflow == 'ci'
        with:
          path: ~/.cache/lumeo/qt
          key: qt-${{ hashFiles('packaging/install-qt.sh') }}
      # ccache's objects from the last run: a build from scratch is most of
      # the job, and a commit changes a few files.
      - uses: actions/cache@v6
        if: github.workflow == 'ci'
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-
      - name: qt
        run: |
          [ -d ~/.cache/lumeo/qt/6.12.0 ] || packaging/install-qt.sh
          echo "CMAKE_PREFIX_PATH=$HOME/.cache/lumeo/qt/6.12.0/gcc_64" >> "$GITHUB_ENV"
      - run: cmake --preset dev
        working-directory: desktop
      - run: cmake --build --preset dev
        working-directory: desktop
      - run: ctest --test-dir build/dev --output-on-failure
        working-directory: desktop
      - run: tool/player-test.sh
        working-directory: desktop
